<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR codes des cartes | VisiTap</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Cpath d='M19 21l13 24 13-24' fill='none' stroke='%23c9a96e' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b0d;--panel:#141417;--line:rgba(255,255,255,.1);--text:#f4eee4;--muted:#a39d93;--gold:#c9a96e;--warn:#e7b35a;--bad:#e56b5d;--ok:#7dc59a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{margin:0 0 4px;font-size:24px;font-weight:650;letter-spacing:.01em}
h1 b{color:var(--gold);font-weight:650}
.sub{margin:0 0 22px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rowf{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=url]{flex:1;min-width:260px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#0e0e10;color:var(--text);font:inherit}
input[type=url]:focus{outline:2px solid var(--gold);outline-offset:1px}
select{height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#0e0e10;color:var(--text);font:inherit}
button{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#1c1c20;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
button.primary{background:linear-gradient(135deg,#efdcb0,#c9a96e 50%,#a2803f);color:#17120a;border-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{margin:12px 0 0;padding:10px 14px;border-radius:10px;font-size:14px}
.msg.warn{background:rgba(231,179,90,.1);border:1px solid rgba(231,179,90,.35);color:#f3d29a}
.msg.bad{background:rgba(229,107,93,.1);border:1px solid rgba(229,107,93,.4);color:#f2b0a8}
.msg.ok{background:rgba(125,197,154,.1);border:1px solid rgba(125,197,154,.35);color:#bfe6cd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;break-inside:avoid}
.card .qr{background:#fff;border-radius:10px;padding:8px;aspect-ratio:1}
.card .qr svg{display:block;width:100%;height:100%}
.card .slug{margin:10px 0 0;font-weight:700;font-size:15px}
.card .who{margin:2px 0 0;font-size:12.5px;color:var(--muted);min-height:18px}
.card .url{margin:4px 0 10px;font-size:11.5px;color:var(--muted);word-break:break-all}
.card .btns{display:flex;gap:6px;justify-content:center}
.card .btns button{height:34px;padding:0 12px;font-size:12.5px}
.count{color:var(--muted);font-size:14px}
@media print{
  body{background:#fff;color:#000}
  .noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .grid{grid-template-columns:repeat(4,1fr);gap:6mm}
  .card{background:#fff;border:1px solid #ccc;border-radius:3mm;padding:3mm}
  .card .qr{padding:0}
  .card .who,.card .btns{display:none}
  .card .slug{color:#000}.card .url{color:#333}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="noprint">
    <h1>Visi<b>Tap</b> — QR codes des cartes</h1>
    <p class="sub">Outil interne : génère un QR code par profil à partir de <code>config.js</code>. Chaque QR contient l'adresse <em>domaine/slug</em> de son propre profil.</p>
  </header>

  <section class="panel noprint">
    <label for="base">Domaine définitif encodé dans les QR codes</label>
    <div class="rowf">
      <input id="base" type="url" placeholder="https://visitap.vercel.app" spellcheck="false" autocomplete="off">
      <select id="filter" aria-label="Profils à afficher">
        <option value="prep">Cartes préparées (profil-XX)</option>
        <option value="all">Tous les profils</option>
      </select>
      <button id="apply" type="button">Générer</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="panel noprint">
    <div class="rowf">
      <button id="zip" class="primary" type="button" disabled>Télécharger tous les QR (ZIP de PNG)</button>
      <button id="print" type="button" disabled>Imprimer la planche</button>
      <span id="count" class="count"></span>
    </div>
  </section>

  <main id="grid" class="grid" aria-live="polite"></main>
</div>

<script>
(function () {
  'use strict';

  /* QR code — encodeur autonome (mode octet, correction M), d'après l'algorithme de référence ISO 18004 */
  var QR = (function () {
    var ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
    var BLK_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];

    function rawModules(v) {
      var r = (16 * v + 128) * v + 64;
      if (v >= 2) { var n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
      return r;
    }
    function dataCodewords(v) { return Math.floor(rawModules(v) / 8) - ECC_M[v] * BLK_M[v]; }
    function gmul(x, y) { var z = 0; for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 0xff; }
    function rsDivisor(deg) {
      var r = []; for (var i = 0; i < deg; i++) r.push(0); r[deg - 1] = 1;
      var root = 1;
      for (i = 0; i < deg; i++) {
        for (var j = 0; j < deg; j++) { r[j] = gmul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; }
        root = gmul(root, 2);
      }
      return r;
    }
    function rsRemainder(data, div) {
      var r = div.map(function () { return 0; });
      data.forEach(function (b) {
        var f = b ^ r.shift(); r.push(0);
        div.forEach(function (c, i) { r[i] ^= gmul(c, f); });
      });
      return r;
    }
    function utf8(s) {
      if (window.TextEncoder) return Array.from(new TextEncoder().encode(s));
      var e = unescape(encodeURIComponent(s)), out = [];
      for (var i = 0; i < e.length; i++) out.push(e.charCodeAt(i));
      return out;
    }

    function encode(text) {
      var bytes = utf8(text), v, cc;
      for (v = 1; v <= 40; v++) {
        cc = v < 10 ? 8 : 16;
        if (4 + cc + bytes.length * 8 <= dataCodewords(v) * 8) break;
      }
      if (v > 40) throw new Error('Texte trop long pour un QR code');

      // Flux de bits
      var bits = [];
      var put = function (val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      put(4, 4); put(bytes.length, cc);
      bytes.forEach(function (b) { put(b, 8); });
      var cap = dataCodewords(v) * 8;
      put(0, Math.min(4, cap - bits.length));
      put(0, (8 - bits.length % 8) % 8);
      for (var pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8);
      var data = [];
      for (var i = 0; i < bits.length; i += 8) { var x = 0; for (var k = 0; k < 8; k++) x = (x << 1) | bits[i + k]; data.push(x); }

      // Correction d'erreurs + entrelacement
      var nb = BLK_M[v], el = ECC_M[v], raw = Math.floor(rawModules(v) / 8);
      var nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = rsDivisor(el), blocks = [], pos = 0;
      for (i = 0; i < nb; i++) {
        var d = data.slice(pos, pos + shortLen - el + (i < nShort ? 0 : 1));
        pos += d.length;
        var ecc = rsRemainder(d, div);
        if (i < nShort) d.push(0);
        blocks.push(d.concat(ecc));
      }
      var cw = [];
      for (i = 0; i < blocks[0].length; i++) for (var j = 0; j < nb; j++) if (i !== shortLen - el || j >= nShort) cw.push(blocks[j][i]);

      // Matrice
      var size = v * 4 + 17, mod = [], fn = [];
      for (i = 0; i < size; i++) { mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
      var set = function (x, y, dark) { mod[y][x] = dark; fn[y][x] = true; };

      for (i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
      [[3, 3], [size - 4, 3], [3, size - 4]].forEach(function (c) {
        for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
          var dist = Math.max(Math.abs(dx), Math.abs(dy)), xx = c[0] + dx, yy = c[1] + dy;
          if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, dist !== 2 && dist !== 4);
        }
      });
      var al = [];
      if (v > 1) {
        var na = Math.floor(v / 7) + 2, step = Math.floor((v * 8 + na * 3 + 5) / (na * 4 - 4)) * 2;
        for (var p = size - 7; al.length < na - 1; p -= step) al.unshift(p);
        al.unshift(6);
      }
      al.forEach(function (ay, ai) {
        al.forEach(function (ax, aj) {
          if ((ai === 0 && aj === 0) || (ai === 0 && aj === al.length - 1) || (ai === al.length - 1 && aj === 0)) return;
          for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        });
      });
      var drawFormat = function (mask) {
        var dd = mask, rem = dd; // niveau M = 00
        for (var q = 0; q < 10; q++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
        var b = ((dd << 10) | rem) ^ 0x5412, g = function (n) { return ((b >>> n) & 1) !== 0; };
        for (q = 0; q <= 5; q++) set(8, q, g(q));
        set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
        for (q = 9; q < 15; q++) set(14 - q, 8, g(q));
        for (q = 0; q < 8; q++) set(size - 1 - q, 8, g(q));
        for (q = 8; q < 15; q++) set(8, size - 15 + q, g(q));
        set(8, size - 8, true);
      };
      drawFormat(0);
      if (v >= 7) {
        var rem = v;
        for (i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
        var vb = (v << 12) | rem;
        for (i = 0; i < 18; i++) { var bit = ((vb >>> i) & 1) !== 0, a = size - 11 + i % 3, bb = Math.floor(i / 3); set(a, bb, bit); set(bb, a, bit); }
      }

      // Placement des données
      var bi = 0;
      for (var right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (var vert = 0; vert < size; vert++) for (j = 0; j < 2; j++) {
          var cx = right - j, up = ((right + 1) & 2) === 0, cy = up ? size - 1 - vert : vert;
          if (!fn[cy][cx] && bi < cw.length * 8) { mod[cy][cx] = ((cw[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
        }
      }

      // Masque : choix du plus lisible
      var maskFn = [
        function (x, y) { return (x + y) % 2 === 0; }, function (x, y) { return y % 2 === 0; },
        function (x) { return x % 3 === 0; }, function (x, y) { return (x + y) % 3 === 0; },
        function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; },
        function (x, y) { return x * y % 2 + x * y % 3 === 0; },
        function (x, y) { return (x * y % 2 + x * y % 3) % 2 === 0; },
        function (x, y) { return ((x + y) % 2 + x * y % 3) % 2 === 0; }
      ];
      var applyMask = function (m) { for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x]; };
      var penalty = function () {
        var s = 0, dark = 0, x, y, run;
        for (y = 0; y < size; y++) {
          run = 1;
          for (x = 1; x < size; x++) { if (mod[y][x] === mod[y][x - 1]) { run++; if (run === 5) s += 3; else if (run > 5) s++; } else run = 1; }
        }
        for (x = 0; x < size; x++) {
          run = 1;
          for (y = 1; y < size; y++) { if (mod[y][x] === mod[y - 1][x]) { run++; if (run === 5) s += 3; else if (run > 5) s++; } else run = 1; }
        }
        for (y = 0; y < size - 1; y++) for (x = 0; x < size - 1; x++) {
          var c = mod[y][x];
          if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) s += 3;
        }
        for (y = 0; y < size; y++) for (x = 0; x < size; x++) if (mod[y][x]) dark++;
        var total = size * size;
        s += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
        return s;
      };
      var best = 0, bestScore = Infinity;
      for (var m = 0; m < 8; m++) {
        applyMask(m); drawFormat(m);
        var sc = penalty();
        if (sc < bestScore) { bestScore = sc; best = m; }
        applyMask(m);
      }
      applyMask(best); drawFormat(best);

      return {
        getModuleCount: function () { return size; },
        isDark: function (r, c) { return mod[r][c]; }
      };
    }
    return { encode: encode };
  })();



  var $ = function (id) { return document.getElementById(id); };
  var baseInput = $('base'), statusEl = $('status'), grid = $('grid'), zipBtn = $('zip'), printBtn = $('print'), countEl = $('count');
  var current = [];   // [{slug, url, name, qr}]

  function str(v) { return (v === undefined || v === null) ? '' : String(v).trim(); }
  function msg(kind, html) { statusEl.innerHTML = '<p class="msg ' + kind + '">' + html + '</p>'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function svgOf(qr) {
    var n = qr.getModuleCount(), m = 4, size = n + m * 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges">' +
      '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/><path d="' + d + '" fill="#000000"/></svg>';
  }
  function pngOf(qr) {
    return new Promise(function (resolve) {
      var n = qr.getModuleCount(), m = 4, scale = Math.max(10, Math.floor(1200 / (n + m * 2)));
      var c = document.createElement('canvas'); c.width = c.height = (n + m * 2) * scale;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000';
      for (var r = 0; r < n; r++) for (var col = 0; col < n; col++) if (qr.isDark(r, col)) x.fillRect((col + m) * scale, (r + m) * scale, scale, scale);
      c.toBlob(resolve, 'image/png');
    });
  }
  function download(blob, name) {
    var u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; a.style.display = 'none'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 4000);
  }

  /* ZIP minimal (stockage sans compression), suffisant pour des PNG */

    var d = new Date(), dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    files.forEach(function (f) {

      parts.push(new Uint8Array(h.buffer), name, f.data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosT, true); c.setUint16(14, dosD, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);

    });
    var cSize = central.reduce(function (s, p) { return s + p.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);

  /* Contrôle du domaine */
  function checkBase(raw) {
    var b = str(raw).replace(/\/+$/, '');
    if (!b) return { ok: false, kind: 'bad', text: 'Indiquez le domaine définitif (ex. <code>https://visitap.vercel.app</code>). Sans lui, aucun QR imprimable ne peut être généré.' };
    var u; try { u = new URL(b); } catch (e) { return { ok: false, kind: 'bad', text: 'Adresse invalide : elle doit commencer par <code>https://</code>.' }; }
    if (u.protocol !== 'https:' && !/^(localhost|127\.0\.0\.1)$/.test(u.hostname)) return { ok: false, kind: 'bad', text: 'Utilisez une adresse en <code>https://</code>.' };
    if (u.pathname !== '/' || u.search || u.hash) return { ok: false, kind: 'bad', text: 'Indiquez uniquement le domaine, sans chemin (pas de <code>/profil-01</code> à la fin).' };
    b = u.origin;
    var notes = [];
    if (/^(localhost|127\.0\.0\.1)$/.test(u.hostname)) notes.push('Adresse locale : ces QR ne fonctionneront pas pour vos clients. Ne les imprimez pas.');
    if (/-[a-z0-9]{9}-[a-z0-9-]+\.vercel\.app$/i.test(u.hostname) || /-git-/.test(u.hostname)) notes.push('Ceci ressemble à une adresse de <strong>prévisualisation</strong> Vercel, qui peut changer. Utilisez l’adresse de production ou votre nom de domaine.');
    var cfgBase = (typeof BRAND !== 'undefined' && BRAND) ? str(BRAND.baseUrl).replace(/\/+$/, '') : '';
    if (cfgBase && cfgBase !== b) notes.push('Ce domaine diffère de <code>baseUrl</code> dans config.js (<code>' + esc(cfgBase) + '</code>). Les QR des cartes et ceux affichés sur le site seraient différents.');
    if (!cfgBase) notes.push('<code>baseUrl</code> est vide dans config.js. Renseignez-y ce même domaine pour que le site affiche et partage exactement les mêmes adresses.');
    return { ok: true, base: b, kind: notes.length ? 'warn' : 'ok', text: notes.length ? notes.join('<br>') : 'Domaine conforme à <code>baseUrl</code> de config.js. Les QR peuvent être imprimés.' };
  }

  function generate() {
    grid.innerHTML = ''; current = []; zipBtn.disabled = printBtn.disabled = true; countEl.textContent = '';
    if (typeof PROFILES === 'undefined' || !Array.isArray(PROFILES)) {
      msg('bad', 'config.js est introuvable ou invalide. Placez <code>qr-codes.html</code> dans le même dossier que <code>config.js</code>.');
      return;
    }
    var chk = checkBase(baseInput.value);
    msg(chk.kind, chk.text);
    if (!chk.ok) return;
    var onlyPrep = $('filter').value === 'prep', seen = {};
    PROFILES.forEach(function (p) {
      if (!p || typeof p !== 'object') return;
      var slug = str(p.slug).toLowerCase();
      if (!slug || seen[slug]) return;
      seen[slug] = true;
      if (onlyPrep && !/^profil-\d+$/.test(slug)) return;
      var url = chk.base + '/' + encodeURIComponent(slug);
      var qr = QR.encode(url);
      var name = [str(p.firstName), str(p.lastName)].filter(Boolean).join(' ') || str(p.company);
      current.push({ slug: slug, url: url, name: name, qr: qr });
    });
    current.forEach(function (it) {
      var card = document.createElement('article'); card.className = 'card'; card.setAttribute('data-slug', it.slug);
      card.innerHTML = '<div class="qr">' + svgOf(it.qr) + '</div><p class="slug">' + esc(it.slug) + '</p><p class="who">' + esc(it.name) + '</p><p class="url">' + esc(it.url) + '</p>' +
        '<div class="btns"><button type="button" data-png>PNG</button><button type="button" data-svg>SVG</button></div>';
      card.querySelector('[data-png]').addEventListener('click', function () { pngOf(it.qr).then(function (b) { download(b, 'qr-' + it.slug + '.png'); }); });
      card.querySelector('[data-svg]').addEventListener('click', function () { download(new Blob([svgOf(it.qr)], { type: 'image/svg+xml' }), 'qr-' + it.slug + '.svg'); });
      grid.appendChild(card);
    });
    countEl.textContent = current.length + ' QR code(s) généré(s), chacun avec sa propre adresse.';
    zipBtn.disabled = printBtn.disabled = !current.length;
  }

  zipBtn.addEventListener('click', function () {
    zipBtn.disabled = true; zipBtn.textContent = 'Préparation…';
    var csv = 'slug;adresse\r\n' + current.map(function (it) { return it.slug + ';' + it.url; }).join('\r\n') + '\r\n';
    Promise.all(current.map(function (it) {
      return pngOf(it.qr).then(function (b) { return b.arrayBuffer(); }).then(function (ab) { return { name: 'qr-' + it.slug + '.png', data: new Uint8Array(ab) }; });
    })).then(function (files) {
      files.push({ name: 'liste-des-adresses.csv', data: new TextEncoder().encode('﻿' + csv) });
      download(makeZip(files), 'visitap-qr-codes.zip');
    }).catch(function (e) { console.error(e); msg('bad', 'La création du ZIP a échoué.'); })
      .then(function () { zipBtn.disabled = false; zipBtn.textContent = 'Télécharger tous les QR (ZIP de PNG)'; });
  });
  printBtn.addEventListener('click', function () { window.print(); });
  $('apply').addEventListener('click', generate);
  $('filter').addEventListener('change', generate);
  baseInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });

  function start() {
    var cfgBase = (typeof BRAND !== 'undefined' && BRAND) ? str(BRAND.baseUrl) : '';
    baseInput.value = cfgBase || (/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? location.origin : '');
    generate();
  }
  // Même chargement de config.js que le site : à côté du fichier, puis à la racine.
  (function load() {
    var list = [], seen = {};
    ['config.js', '/config.js'].forEach(function (s) {
      if (location.protocol === 'file:' && s.charAt(0) === '/') return;
      var a; try { a = new URL(s, location.href).href; } catch (e) { a = s; }
      if (!seen[a]) { seen[a] = true; list.push(a); }
    });
    (function next(i) {
      if (typeof PROFILES !== 'undefined' || i >= list.length) return start();
      var sc = document.createElement('script'); sc.src = list[i];
      sc.onload = function () { next(i + 1); }; sc.onerror = function () { sc.remove(); next(i + 1); };
      document.head.appendChild(sc);
    })(0);
  })();
})();
</script>
</body>
</html>
